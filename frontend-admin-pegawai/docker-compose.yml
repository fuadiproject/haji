services:
  # Production service
  nuxt-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - API_USER_PRESENSI_URL=$API_USER_PRESENSI_URL
        - API_BASE_URL=$API_BASE_URL        
    ports:
      - "3004:3004"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  shared-network:
    external: true
