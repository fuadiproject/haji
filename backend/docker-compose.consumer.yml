services:
  event-listener:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  shared-network:
    external: true