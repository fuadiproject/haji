services:
  # Production service
  nuxt-app:
    build:
      context: .
      target: production
      args:
        - API_BASE_URL=${API_BASE_URL}
        - API_BPH_URL=${API_BPH_URL}
        - API_MASTER_DATA_URL=${API_MASTER_DATA_URL}
        - API_SUPER_APP_URL=${API_SUPER_APP_URL}
    ports:
      - "3002:3002"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
