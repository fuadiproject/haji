services:
  # Production service
  nuxt-app:
    build:
      context: .
      target: production
      args:
        - API_BASE_URL=${API_BASE_URL}
        - API_PRESENSI_URL=${API_PRESENSI_URL}
        - API_SUPER_APP_URL=${API_SUPER_APP_URL}
        - API_SURAT_URL=${API_SURAT_URL}
        - ONESIGNAL_APP_ID=${ONESIGNAL_APP_ID}
        - KEYCLOAK_BASE_URL=${KEYCLOAK_BASE_URL}
        - KEYCLOAK_REALM=${KEYCLOAK_REALM}
        - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
        - KEYCLOAK_REDIRECT_URL=${KEYCLOAK_REDIRECT_URL}
        - KEYCLOAK_LOGOUT_URL=${KEYCLOAK_LOGOUT_URL}
    ports:
      - "8080:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - API_BASE_URL=${API_BASE_URL}
      - API_PRESENSI_URL=${API_PRESENSI_URL}
      - API_SUPER_APP_URL=${API_SUPER_APP_URL}
      - API_SURAT_URL=${API_SURAT_URL}
      - ONESIGNAL_APP_ID=${ONESIGNAL_APP_ID}
      - KEYCLOAK_BASE_URL=${KEYCLOAK_BASE_URL}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_REDIRECT_URL=${KEYCLOAK_REDIRECT_URL}
      - KEYCLOAK_LOGOUT_URL=${KEYCLOAK_LOGOUT_URL}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
